<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تواصل معنا | أكاديمية نور الدين</title><link rel="stylesheet" href="style.css"></head><body><header><div class="header-inner"><a class="brand" href="index.html">أكاديمية نور الدين<small>تواصل معنا</small></a><a class="back" href="index.html">الرئيسية</a></div></header><main><section class="hero"><div class="eyebrow">CONTACT</div><h1>يسعدنا سماع ملاحظاتك</h1><p>اكتب رسالتك وجهّز نسخة قابلة للنسخ والإرسال.</p></section><section class="panel"><form id="contactForm"><label for="name">الاسم</label><input id="name" required maxlength="80" placeholder="اسمك"><label for="email">البريد الإلكتروني</label><input id="email" type="email" required maxlength="120" placeholder="name@example.com"><label for="message">الرسالة</label><textarea id="message" required rows="5" maxlength="3000" placeholder="اكتب رسالتك هنا"></textarea><button type="submit">تجهيز الرسالة</button></form><div id="result" hidden><h3>رسالتك جاهزة</h3><p class="muted">لم تتم إضافة بريد مستلم للأكاديمية بعد، لذلك لا يمكن إرسالها تلقائياً. انسخ النص وأرسله عبر وسيلة التواصل المعتمدة.</p><textarea id="prepared" rows="8" readonly></textarea><button id="copyMessage">نسخ الرسالة</button></div></section></main><footer>أكاديمية نور الدين</footer><script>
const form=document.getElementById("contactForm");
form.addEventListener("submit",event=>{event.preventDefault();const name=document.getElementById("name").value.trim();const email=document.getElementById("email").value.trim();const message=document.getElementById("message").value.trim();document.getElementById("prepared").value="الاسم: "+name+"\nالبريد الإلكتروني: "+email+"\n\nالرسالة:\n"+message;document.getElementById("result").hidden=false;});
document.getElementById("copyMessage").addEventListener("click",async()=>{const field=document.getElementById("prepared");try{await navigator.clipboard.writeText(field.value);document.getElementById("copyMessage").textContent="تم النسخ";}catch{field.focus();field.select();document.getElementById("copyMessage").textContent="حدد النص وانسخه";}});
</script></body></html>
