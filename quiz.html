<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختبر معلوماتك | أكاديمية نور الدين</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>أكاديمية نور الدين</h1>
  <p>اختبر معلوماتك في التحليل الفني</p>
</header>

<main class="container">
  <h2>اختبار التحليل الفني</h2>

  <div id="quiz">
    <h3 id="question">ما المقصود بالاتجاه الصاعد؟</h3>

    <div id="answers">
      <button onclick="checkAnswer(this, true)">قمم وقيعان أعلى</button>
      <button onclick="checkAnswer(this, false)">قمم وقيعان أقل</button>
      <button onclick="checkAnswer(this, false)">حركة جانبية</button>
    </div>

    <p id="result"></p>
    <p id="score">النتيجة: 0</p>

    <button onclick="nextQuestion()">السؤال التالي</button>
  </div>

  <a href="index.html">العودة للرئيسية</a>
</main>

<script>
const questions = [
  {
    q: "ما المقصود بالاتجاه الصاعد؟",
    a: ["قمم وقيعان أعلى", "قمم وقيعان أقل", "حركة جانبية"],
    correct: 0
  },
  {
    q: "ماذا يمثل مؤشر RSI؟",
    a: ["حجم التداول", "الزخم", "السعر فقط"],
    correct: 1
  },
  {
    q: "ما وظيفة وقف الخسارة؟",
    a: ["زيادة الرافعة", "تقليل الخسائر المحتملة", "زيادة حجم الصفقة"],
    correct: 1
  },
  {
    q: "ما نظرية وايكوف؟",
    a: ["تحليل التجميع والتصريف", "تحليل الأخبار فقط", "تحليل العملات فقط"],
    correct: 0
  }
];

let current = 0;
let score = 0;
let answered = false;

function loadQuestion() {
  answered = false;
  document.getElementById("question").textContent = questions[current].q;
  document.getElementById("result").textContent = "";

  const answers = document.getElementById("answers");
  answers.innerHTML = "";

  questions[current].a.forEach((answer, index) => {
    const button = document.createElement("button");
    button.textContent = answer;
    button.onclick = () => checkAnswer(button, index === questions[current].correct);
    answers.appendChild(button);
  });
}

function checkAnswer(button, correct) {
  if (answered) return;
  answered = true;

  if (correct) {
    score++;
    document.getElementById("result").textContent = "إجابة صحيحة!";
  } else {
    document.getElementById("result").textContent = "إجابة خاطئة!";
  }

  document.getElementById("score").textContent = "النتيجة: " + score;
}

function nextQuestion() {
  if (!answered) return;

  current++;

  if (current >= questions.length) {
    document.getElementById("quiz").innerHTML =
      "<h3>انتهى الاختبار</h3><p>نتيجتك: " +
      score + " من " + questions.length + "</p>" +
      "<button onclick='location.reload()'>إعادة الاختبار</button>";
    return;
  }

  loadQuestion();
}

loadQuestion();
</script>

</body>
</html>
