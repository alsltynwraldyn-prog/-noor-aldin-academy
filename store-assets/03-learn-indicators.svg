<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#1a3048"/><stop offset="1" stop-color="#081321"/></linearGradient></defs><rect width="1080" height="1920" fill="url(#b)"/><text x="540" y="170" fill="#e5c477" font-size="40" font-family="Arial" text-anchor="middle" letter-spacing="8">ARVYQEN</text><text x="540" y="360" fill="#fff" font-size="76" font-weight="bold" font-family="Arial" text-anchor="middle">افهم أدوات التحليل</text><text x="540" y="455" fill="#c4d0de" font-size="40" font-family="Arial" text-anchor="middle">تعلّم المؤشرات قبل استخدامها</text><g font-family="Arial"><rect x="115" y="600" width="850" height="230" rx="32" fill="#142941" stroke="#52657b" stroke-width="2"/><text x="870" y="700" fill="#e5c477" font-size="52" font-weight="bold" text-anchor="end">RSI</text><text x="870" y="770" fill="#d4deea" font-size="34" text-anchor="end">مؤشر القوة النسبية والزخم</text><path d="M180 750Q250 650 320 740T470 680T620 750T790 680" fill="none" stroke="#58d5aa" stroke-width="7"/><rect x="115" y="890" width="850" height="230" rx="32" fill="#142941" stroke="#52657b" stroke-width="2"/><text x="870" y="990" fill="#e5c477" font-size="52" font-weight="bold" text-anchor="end">MACD</text><text x="870" y="1060" fill="#d4deea" font-size="34" text-anchor="end">الاتجاه وتقاطع خطوط المؤشر</text><path d="M180 1060Q270 950 360 1010T540 960T720 1030T850 950" fill="none" stroke="#e6bd69" stroke-width="7"/><rect x="115" y="1180" width="850" height="230" rx="32" fill="#142941" stroke="#52657b" stroke-width="2"/><text x="870" y="1280" fill="#e5c477" font-size="52" font-weight="bold" text-anchor="end">MOVING AVERAGES</text><text x="870" y="1350" fill="#d4deea" font-size="34" text-anchor="end">المتوسطات المتحركة والاتجاه</text><path d="M180 1350Q260 1270 350 1320T520 1250T700 1310T850 1230" fill="none" stroke="#62a9e6" stroke-width="7"/></g><text x="540" y="1640" fill="#fff" font-size="